name: Auto Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Run deployment
        working-directory: /opt/autopublish
        run: |
          echo "=== Deploy started: $(date) ==="
          set -e

          # Pull all repos
          for repo in frontend backend llm-gateway; do
            echo "[$repo] Pulling latest..."
            cd /opt/autopublish/$repo
            git fetch origin
            git reset --hard origin/master
          done

          # Rebuild and restart (no-cache for backend to ensure deps are fresh)
          cd /opt/autopublish
          docker-compose -f deploy/docker-compose.yml build --no-cache backend
          docker-compose -f deploy/docker-compose.yml build nginx llm-gateway
          docker-compose -f deploy/docker-compose.yml up -d backend nginx llm-gateway

          # Cleanup old images
          docker image prune -f

          echo "=== Deploy completed: $(date) ==="
