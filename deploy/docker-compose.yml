version: '3.8'

# ============================================================
# AutoPublish - 全栈部署配置
# 基于 2核4G 资源优化，所有服务整合在同一台 LAS 实例
# ============================================================

networks:
  autopublish-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1480

volumes:
  postgres-data:
  redis-data:
  es-data:
  prometheus-data:
  grafana-data:
  backend-data:

services:

  # ─── PostgreSQL：主数据库 ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autopublish-postgres
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: autopublish
      POSTGRES_USER: autopublish
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autopublish_prod_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopublish -d autopublish"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ─── Redis：缓存 / 任务队列 ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autopublish-redis
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ─── Elasticsearch：日志 / Trace 存储 ────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: autopublish-es
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - cluster.name=autopublish-obs
      - action.auto_create_index=true
      - indices.memory.index_buffer_size=10%
      - indices.fielddata.cache.size=20%
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  # ─── Nginx：反向代理 + 前端静态文件 ────────────────
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    container_name: autopublish-nginx
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "8080:80"
    depends_on:
      - backend
      - llm-gateway
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # ─── Backend API：AutoPublish 核心 ──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopublish-api
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://autopublish:autopublish_prod_2024@postgres:5432/autopublish}
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OTEL_SERVICE_NAME=autopublish-api
      - DEPLOYMENT_ENVIRONMENT=production
      - DEBUG=false
      - LOG_JSON=true
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ─── LLM Gateway：LLM 路由 / 限流 / 熔断 ──────────
  llm-gateway:
    build:
      context: ./llm-gateway
      dockerfile: Dockerfile
    container_name: autopublish-llm-gateway
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "9010:9010"
    env_file:
      - ./llm-gateway/.env.production
    environment:
      - REDIS_URL=redis://redis:6379/1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DEPLOYMENT_ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Prometheus：指标采集 ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: autopublish-prometheus
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ─── Grafana：可视化看板 ────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: autopublish-grafana
    restart: unless-stopped
    networks:
      - autopublish-net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./deploy/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
