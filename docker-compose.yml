version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: autopublish-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: autopublish
      POSTGRES_USER: autopublish
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autopublish_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopublish -d autopublish"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopublish-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://autopublish:autopublish_dev@postgres:5432/autopublish
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - DEBUG=true
      - LLM_GATEWAY_URL=http://llm-gateway:9010/v1
      - OTEL_SERVICE_NAME=autopublish-api
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - .:/app
      - autopublish-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  autopublish-data:
