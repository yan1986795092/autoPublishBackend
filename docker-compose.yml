version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopublish-api
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=sqlite:///./autopublish.db
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - DEBUG=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Observability — ES/Prometheus 由 infra compose 提供
      - OTEL_SERVICE_NAME=autopublish-api
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PROMETHEUS_HOST=http://prometheus:9090
    volumes:
      - .:/app
      - autopublish-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  autopublish-data:
